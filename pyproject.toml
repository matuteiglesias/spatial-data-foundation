[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-data-foundation"
version = "0.1.0"
description = "Reusable geography, time, provenance and spatial-membership infrastructure for empirical research"
requires-python = ">=3.10"
dependencies = [
  "empirical-data-contracts>=0.1,<0.2",
  "geopandas>=0.14",
  "shapely>=2",
  "pyproj>=3.5",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
io = ["pyarrow>=15", "duckdb>=1.0"]
raster = ["rasterio>=1.3"]
cli = ["typer>=0.12"]
presentation = [
  "matplotlib>=3.8",
  "contextily>=1.7.1,<2",
  "xyzservices>=2026.3,<2027",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pyarrow>=15",
  "build>=1.2",
  "matplotlib>=3.8",
  "contextily>=1.7.1,<2",
  "xyzservices>=2026.3,<2027",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
