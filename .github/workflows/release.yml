name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build and verify release distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out released tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        run: |
          VERSION=$(python - <<'PY'
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path("pyproject.toml").read_text())
          print(data["project"]["version"])
          PY
          )
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1

      - name: Verify core wheel in a fresh environment
        run: |
          WHEEL=$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$WHEEL"
          python -m venv /tmp/spatial-foundation-core
          /tmp/spatial-foundation-core/bin/python -m pip install "$WHEEL"
          cd /tmp
          /tmp/spatial-foundation-core/bin/python - <<'PY'
          from pathlib import Path
          import sys
          import sysconfig

          import geopandas as gpd
          from shapely.geometry import Polygon
          import spatial_foundation as sf

          assert "contextily" not in sys.modules
          package_path = Path(sf.__file__).resolve()
          purelib = Path(sysconfig.get_paths()["purelib"]).resolve()
          assert package_path.is_relative_to(purelib), (package_path, purelib)

          polygons = gpd.GeoDataFrame(
              {"geo_uid": ["A"], "geometry_role": ["analytical"]},
              geometry=[Polygon([(0, 0), (10, 0), (10, 10), (0, 10)])],
              crs="EPSG:3857",
          )
          objects = gpd.GeoDataFrame(
              {"object_id": ["o1"]},
              geometry=[Polygon([(1, 1), (2, 1), (2, 2), (1, 2)])],
              crs="EPSG:3857",
          )
          result, audit = sf.relate_areal_objects(
              objects,
              polygons,
              object_id_col="object_id",
              area_crs="EPSG:3857",
          )
          assert result.loc[0, "geo_uid"] == "A"
          assert audit.matched_single == 1
          PY

      - name: Verify presentation extra in a fresh environment
        run: |
          WHEEL=$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$WHEEL"
          python -m venv /tmp/spatial-foundation-presentation
          /tmp/spatial-foundation-presentation/bin/python -m pip install "${WHEEL}[presentation]"
          cd /tmp
          /tmp/spatial-foundation-presentation/bin/python - <<'PY'
          from pathlib import Path
          import sysconfig

          import spatial_foundation.presentation as presentation

          package_path = Path(presentation.__file__).resolve()
          purelib = Path(sysconfig.get_paths()["purelib"]).resolve()
          assert package_path.is_relative_to(purelib), (package_path, purelib)
          assert presentation.resolve_basemap("neutral").name == "CartoDB.Positron"
          assert presentation.resolve_basemap("imagery").name == "Esri.WorldImagery"
          assert presentation.resolve_basemap("terrain").name == "OpenTopoMap"
          PY

      - name: Verify IO materialization extra in a fresh environment
        run: |
          WHEEL=$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$WHEEL"
          python -m venv /tmp/spatial-foundation-io
          /tmp/spatial-foundation-io/bin/python -m pip install "${WHEEL}[io]"
          cd /tmp
          /tmp/spatial-foundation-io/bin/python - <<'PY'
          import json
          from importlib.metadata import version
          from pathlib import Path

          import spatial_foundation as sf

          source = Path("release-gadm.geojson").resolve()
          source.write_text(
              json.dumps(
                  {
                      "type": "FeatureCollection",
                      "features": [
                          {
                              "type": "Feature",
                              "properties": {"GID_0": "AAA"},
                              "geometry": {
                                  "type": "Polygon",
                                  "coordinates": [
                                      [[0, 0], [1, 0], [1, 1], [0, 1], [0, 0]]
                                  ],
                              },
                          }
                      ],
                  }
              ),
              encoding="utf-8",
          )
          snapshot = sf.register_external_snapshot("gadm", "4.1", [source])
          result = sf.materialize_gadm(
              snapshot=snapshot,
              levels=[0],
              output_root=Path("release-assets").resolve(),
          )
          manifest = json.loads(result.manifest_path.read_text(encoding="utf-8"))
          package_version = version("spatial-data-foundation")
          assert manifest["code_commit"] is None
          assert manifest["package_version"] == package_version
          assert (
              manifest["parameters"]["runtime_versions"]["spatial-data-foundation"]
              == package_version
          )
          assert manifest["parameters"]["source_io"] == {
              "vector_backend": "pyogrio",
              "vector_use_arrow": True,
              "column_projection": True,
          }
          assert result.outputs[0].exists()
          PY

      - name: Upload exact release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/spatial-data-foundation
    permissions:
      id-token: write

    steps:
      - name: Download exact release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
