name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clean-consumer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out spatial-data-foundation only
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade installer
        run: python -m pip install --upgrade pip

      - name: Install project from pyproject
        run: python -m pip install ".[dev]"

      - name: Verify external contracts dependency
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import json
          import empirical_contracts
          import spatial_foundation

          dist = metadata.distribution("empirical-data-contracts")
          print("empirical-data-contracts", dist.version)
          print("empirical_contracts", empirical_contracts.__file__)
          print("spatial_foundation", spatial_foundation.__file__)

          direct_url = dist.read_text("direct_url.json")
          if direct_url:
              payload = json.loads(direct_url)
              assert not payload.get("dir_info", {}).get("editable", False), payload
              assert "matuteiglesias/empirical-data-contracts" not in payload.get("url", ""), payload
          PY

      - name: Run tests
        run: pytest

      - name: Run ruff
        run: ruff check .

      - name: Build distributions
        run: python -m build

  minimum-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Check out spatial-data-foundation only
        uses: actions/checkout@v4

      - name: Set up minimum supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install declared dependency floors
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint requirements/minimum.txt ".[io]" "pytest>=8,<9"

      - name: Verify resolved floor versions
        run: |
          python - <<'PY'
          import importlib.metadata as metadata

          expected = {
              "empirical-data-contracts": "0.1.0",
              "numpy": "1.24.4",
              "pandas": "2.2.0",
              "geopandas": "1.1.0",
              "shapely": "2.1.0",
              "pyproj": "3.7.0",
              "pyogrio": "0.8.0",
              "pydantic": "2.7.0",
              "pyarrow": "15.0.0",
          }
          resolved = {name: metadata.version(name) for name in expected}
          print(resolved)
          assert resolved == expected
          PY

      - name: Run core and materialization suite at floors
        run: |
          pytest -q \
            tests/test_adversarial_spatial.py \
            tests/test_areal_overlap.py \
            tests/test_catalog.py \
            tests/test_external_consumer.py \
            tests/test_gadm_io.py \
            tests/test_gadm_materialization.py \
            tests/test_geography.py \
            tests/test_membership_kernel.py \
            tests/test_periods.py \
            tests/test_spatial_invariants.py

  benchmark-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out spatial-data-foundation only
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Compare B1 baseline and current kernels
        run: |
          python -m benchmarks.run --preset small --compare --output benchmark-small.json
          python -m benchmarks.run --preset medium --compare --output benchmark-medium.json

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: spatial-benchmark-comparison
          path: |
            benchmark-small.json
            benchmark-medium.json

  distribution-boundary:
    runs-on: ubuntu-latest

    steps:
      - name: Check out spatial-data-foundation only
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install distribution-test tooling only
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest

      - name: Verify clean core and presentation wheel consumers
        env:
          SPATIAL_FOUNDATION_FULL_DISTRIBUTION: "1"
        run: pytest -q --noconftest tests/test_distribution.py
